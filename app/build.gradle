plugins {
    id "com.android.application"
}

android {
    namespace "com.example.aiandroidchat"
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.example.aiandroidchat"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "OPENAI_MODEL", "\"gpt-5.4-mini\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
